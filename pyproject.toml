[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "otoshi"
version = "1.0.0"
authors = [
  { name="Enes Uygur", email="enesuygurs@gmail.com" },
]
description = "A professional high-performance macro recorder and auto clicker."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "customtkinter>=5.2.0",
    "keyboard>=0.13.5",
    "pynput>=1.7.6",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[project.urls]
"Homepage" = "https://github.com/enesuygurs/otoshi"
"Bug Tracker" = "https://github.com/enesuygurs/otoshi/issues"

[project.scripts]
otoshi = "main:main"
