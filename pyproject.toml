[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otoshi"
dynamic = ["version"]
description = "Macro recorder and auto clicker for Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enes Uygur", email = "enesuygurs@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Desktop Environment",
]
dependencies = [
    "customtkinter>=5.2.2,<7",
    "pynput>=1.7.6,<2",
    "pystray>=0.19.5,<1",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/Enesuygurs/Otoshi"
Issues = "https://github.com/Enesuygurs/Otoshi/issues"

[project.gui-scripts]
otoshi = "otoshi.app:main"

[tool.setuptools.dynamic]
version = { attr = "otoshi.__version__" }

[tool.setuptools.packages.find]
include = ["otoshi*"]

[tool.setuptools.package-data]
otoshi = ["assets/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.Optional/List for 3.9 compatibility
